<!doctype html>
<html lang="en" class="fit">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyPACS — 3D Reconstruction</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="mypacs.css"><link rel="stylesheet" href="fx.css"><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="recon.css">
<script src="fx-head.js"></script>
</head>
<body class="viewer recon">
<div class="backdrop"><img src="assets/bg-wave.png" alt=""></div>
<main class="stage">
  <a class="tc serif brand" href="home.html" style="left:19.75rem;top:7.1rem;font-size:4.5rem">MyPACS</a>

  <header class="vbar-top">
    <a class="nav-btn" id="back" href="viewer.html" title="Back to the viewer" aria-label="Back to the viewer"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span class="pri">3D</span>
    <span class="who">Reconstruction</span>
    <div class="seg" id="series" aria-label="Series"></div>
    <span class="grow"></span>
    <span class="meta" id="h-meta"></span>
    <span class="pri anon" title="This series has no patient name or ID in its files">Anonymised</span>
  </header>
  <a class="avatar" href="settings.html" title="Account settings" style="left:173.9rem;top:2.1rem"><img src="assets/avatar.png" alt="Account settings"></a>

  <!-- the three flat slices through the inspected point -->
  <aside class="col mpr lit">
    <h2>Slices</h2>
    <div class="pane" data-plane="ax"><div class="cap"><b>Axial</b><span></span></div><div class="box"><div class="fit2"><canvas></canvas><i class="h"></i><i class="v"></i><em class="l">R</em><em class="r">L</em><em class="t">A</em><em class="b">P</em></div></div></div>
    <div class="pane" data-plane="co"><div class="cap"><b>Coronal</b><span></span></div><div class="box"><div class="fit2"><canvas></canvas><i class="h"></i><i class="v"></i><em class="l">R</em><em class="r">L</em><em class="t">S</em><em class="b">I</em></div></div></div>
    <div class="pane" data-plane="sa"><div class="cap"><b>Sagittal</b><span></span></div><div class="box"><div class="fit2"><canvas></canvas><i class="h"></i><i class="v"></i><em class="l">A</em><em class="r">P</em><em class="t">S</em><em class="b">I</em></div></div></div>
  </aside>

  <!-- 3D viewport -->
  <section class="col vp lit" id="vp">
    <canvas id="gl"></canvas>
    <svg class="draw" id="draw"></svg>
    <div class="ov" style="left:3rem;top:2.6rem" id="ov-tl"></div>
    <div class="ov" style="right:3rem;top:2.6rem;text-align:right" id="ov-tr"></div>
    <div class="ov" style="left:3rem;bottom:2.6rem" id="ov-bl"></div>
    <div class="ov" style="right:3rem;bottom:2.6rem;text-align:right" id="ov-br"></div>
    <div class="loading" id="loading"><i></i><span>Reading the series…</span></div>
  </section>

  <nav class="dock lit" id="dock" aria-label="3D tools">
    <div class="sel"></div>
    <button class="tool" data-tool="rotate" data-tip="Rotate  (1)"><svg viewBox="0 0 24 24"><path d="M4 12c0-2.2 3.6-4 8-4s8 1.8 8 4-3.6 4-8 4"/><path d="M9 13l3 3-3 3"/><path d="M12 3v3M12 19v2"/></svg></button>
    <button class="tool" data-tool="pan" data-tip="Pan  (2)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
    <button class="tool" data-tool="measure" data-tip="Measure in mm  (M)"><svg viewBox="0 0 24 24"><path d="M4 16L16 4l4 4L8 20z M7.5 12.5l2 2M10.5 9.5l2 2M13.5 6.5l2 2"/></svg></button>
    <button class="tool" data-tool="probe" data-tip="Inspect a point  (I)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button>
    <span class="sep"></span>
    <button class="tool" data-act="explode" data-tip="Exploded view  (E)"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="3.6" rx="1.2"/><rect x="5" y="10.2" width="14" height="3.6" rx="1.2"/><rect x="5" y="16.9" width="14" height="3.6" rx="1.2"/></svg></button>
    <button class="tool" data-act="box" data-tip="Size box  (B)"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5l8 4.5 8-4.5M12 12v9"/></svg></button>
    <button class="tool" data-act="spin" data-tip="Turntable  (T)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
    <span class="sep"></span>
    <button class="tool" data-act="clear" data-tip="Clear measurements"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
    <button class="tool" data-act="reset" data-tip="Reset view  (R)"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg></button>
    <button class="tool" data-act="full" data-tip="Full screen  (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </nav>

  <!-- controls and metadata -->
  <aside class="col side lit">
    <div class="seg rtabs" id="tabs"><button data-tab="view" aria-pressed="true">View</button><button data-tab="meta" aria-pressed="false">Metadata</button></div>

    <div class="tab" data-tab="view">
      <div class="size">
        <div class="label">Size of the body in this scan</div>
        <div class="dims"><div><b id="s-w"></b><small>mm wide</small></div><div><b id="s-d"></b><small>mm deep</small></div><div><b id="s-h"></b><small>mm tall</small></div></div>
        <div class="label" id="s-vox"></div>
      </div>
      <div class="line"></div>
      <div class="ctl"><span class="label">Render</span>
        <div class="seg" id="mode"><button data-v="solid">Solid</button><button data-v="iso">Threshold</button><button data-v="glass">Glass</button><button data-v="mip">MIP</button></div></div>
      <label class="ctl" id="c-iso"><span class="label">Threshold</span><input type="range" id="iso" min="2" max="90" value="20"><output></output></label>
      <div class="ctl"><span class="label">Explode</span>
        <div class="seg" id="axis"><button data-v="2">Axial</button><button data-v="1">Coronal</button><button data-v="0">Sagittal</button></div></div>
      <label class="ctl"><span class="label">Pieces</span><input type="range" id="pieces" min="2" max="12" value="6"><output></output></label>
      <label class="ctl"><span class="label">Gap</span><input type="range" id="gap" min="0" max="80" value="0"><output></output></label>
      <label class="ctl"><span class="label">Cut from front</span><input type="range" id="cut1" min="0" max="95" value="0"><output></output></label>
      <label class="ctl"><span class="label">Cut from top</span><input type="range" id="cut2" min="0" max="95" value="0"><output></output></label>
      <label class="ctl"><span class="label">Cut from left</span><input type="range" id="cut0" min="0" max="95" value="0"><output></output></label>
      <div class="line"></div>
      <div class="probe">
        <div class="label">Inspected point</div>
        <div class="kv"><span>Position</span><b id="p-pos">–</b></div>
        <div class="kv"><span>Voxel</span><b id="p-vox">–</b></div>
        <div class="kv"><span>Value</span><b id="p-val">–</b></div>
      </div>
      <div class="label">Measurements</div>
      <div class="mlist" id="mlist"><span class="none">Pick the ruler, then click two points on the surface.</span></div>
    </div>

    <div class="tab" data-tab="meta" hidden>
      <div class="tags" id="tags"></div>
      <div class="credit" id="credit"></div>
    </div>
  </aside>
</main>
<script src="api.js"></script>
<script src="mockstore.js"></script>
<script src="fx.js"></script>
<script src="recon.js"></script>
</body>
</html>
