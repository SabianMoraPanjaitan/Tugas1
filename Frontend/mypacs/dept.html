<!doctype html>
<html lang="en" class="fit">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyPACS — Installation</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="mypacs.css"><link rel="stylesheet" href="fx.css"><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="flow.css">
<script src="fx-head.js"></script>
</head>
<body class="flow">
<div class="backdrop"><img src="assets/bg-wave.png" alt=""></div>
<main class="stage">
  <a class="tc serif brand" href="index.html" style="left:19.75rem;top:7.1rem;font-size:4.5rem">MyPACS</a>
  <h1 class="t" id="d-name" style="left:34.6rem;top:7.1rem"></h1>
  <p class="t sub" id="d-local" style="left:34.6rem;top:12.6rem"></p>
  <a class="pill-link" href="installations.html" style="left:155rem"><span aria-hidden="true">‹</span> Installations</a>

  <form class="card lit" id="form" style="left:9rem;width:78rem">
    <h2>New radiology request</h2>
    <div class="line"></div>
    <label class="field"><span class="label">Patient</span><select id="f-pat" required></select></label>
    <div class="field row2"><span class="label">Modality</span><div class="seg" id="f-mod"></div></div>
    <label class="field row2"><span class="label">Examination</span><select id="f-exam"></select></label>
    <div class="field row2"><span class="label">Priority</span><div class="seg" id="f-pri"><button type="button" data-v="ROUTINE">Routine</button><button type="button" data-v="URGENT">Urgent</button><button type="button" data-v="STAT">STAT</button></div></div>
    <label class="field row2"><span class="label">Referring doctor</span><select id="f-ref"></select></label>
    <label class="field" style="flex:1"><span class="label">Clinical history and question</span><textarea id="f-hist" required placeholder="Why is this examination needed?"></textarea></label>
    <div class="field"><span class="label">Supporting documents (referral letter, earlier results)</span>
      <div class="files" id="f-files"><label class="linkbtn" style="cursor:pointer">Attach files<input type="file" id="f-file" multiple hidden></label></div></div>
    <button class="pbtn solid" type="submit">Send to Radiology</button>
  </form>

  <section class="card lit" style="left:91rem;width:92rem">
    <div class="head"><h2>Sent requests</h2><div class="seg" id="filter"><button data-v="open" aria-pressed="true">Open</button><button data-v="done" aria-pressed="false">Results</button><button data-v="all" aria-pressed="false">All</button></div></div>
    <div class="line"></div>
    <div class="scroll" id="list"></div>
  </section>
</main>
<script src="api.js"></script>
<script src="mockstore.js"></script>
<script src="fx.js"></script>
<script>
(async function () {
  const $ = s => document.querySelector(s), id = new URLSearchParams(location.search).get('d') || 'igd', inst = MockStore.installation(id);
  // Each request carries the unit it comes from (data.unit = this unit's short name, e.g. "Bedah"). Requests made before
  // units existed, or on the old bedah.html, have none: they count as Bedah's, the only ward that could order then.
  const live = await MyApi.ready;
  const unitOf = o => String((o.data && o.data.unit) || 'Bedah').toLowerCase();
  $('#d-name').textContent = inst.name; $('#d-local').textContent = inst.local + ' · requests to Radiology'; document.title = 'MyPACS — ' + inst.name;
  // the backend's exam modalities (EXAM_MODALITIES in main.py) and the MyPACS exam names that fit each
  const API_MOD = { DX: 'X-Ray', CT: 'CT', MR: 'MRI', US: 'USG' };
  const allExams = MockStore.exams(), exams = live ? Object.fromEntries(Object.entries(API_MOD).map(([k, m]) => [k, allExams[m]])) : allExams;
  const form = { mod: 'CT', pri: live ? 'Biasa' : 'ROUTINE', files: [] };
  let me = null;
  const ageOf = b => { const d = new Date(b); if (!b || isNaN(d)) return '-'; const n = new Date(); let a = n.getFullYear() - d.getFullYear(); if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--; return a; };
  const sexOf = g => g === 'Laki-laki' ? 'M' : g === 'Perempuan' ? 'F' : '-';
  if (live) {
    // priority: the backend's two values, as the old bedah.html sends them
    $('#f-pri').innerHTML = '<button type="button" data-v="Biasa">Routine</button><button type="button" data-v="CITO">CITO</button>';
    // the referring doctor is the logged-in user (the backend sets it from the login)
    me = await MyApi.user();
    $('#f-ref').add(new Option(me ? me.full_name : '-', '')); $('#f-ref').disabled = true;
    // supporting documents: the backend has no route for them
    $('#f-files').innerHTML = '<span class="label">Not stored by the SIMRS backend yet.</span>';
    let patients = [];
    try { patients = await MyApi.get('patients'); }
    catch (err) { $('#f-pat').add(new Option(err.status === 403 ? 'Your account cannot see the patient list.' : 'Patient list could not be loaded: ' + err.message, '')); }
    if (!patients.length && !$('#f-pat').options.length) $('#f-pat').add(new Option('No registered patients yet.', ''));
    patients.forEach(p => $('#f-pat').add(new Option(p.name + '  ·  ' + p.nik + '  ·  ' + ageOf(p.birthDate) + ' / ' + sexOf(p.gender), p.nik)));
  } else {
    MockStore.patients().forEach(p => $('#f-pat').add(new Option(p.name + '  ·  ' + p.mrn + '  ·  ' + p.age + ' / ' + p.sex, p.mrn)));
    MockStore.referrers().forEach(r => $('#f-ref').add(new Option(r, r)));
  }
  Object.keys(exams).forEach(m => { const b = document.createElement('button'); b.type = 'button'; b.dataset.v = m; b.textContent = m; $('#f-mod').append(b); });
  function seg(box, key, after) {
    const paint = () => box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === form[key]));
    box.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; form[key] = b.dataset.v; paint(); after && after(); }); paint();
  }
  const fillExams = () => { const s = $('#f-exam'); s.textContent = ''; exams[form.mod].forEach(x => s.add(new Option(x.replace('\n', ' '), x))); };
  seg($('#f-mod'), 'mod', fillExams); seg($('#f-pri'), 'pri'); fillExams();
  function paintFiles() {
    const box = $('#f-files'); box.querySelectorAll('.chip').forEach(c => c.remove());
    form.files.forEach(f => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = f.name + '  ·  ' + Math.max(1, Math.round(f.size / 1024)) + ' KB'; box.prepend(c); });
  }
  if (!live) $('#f-file').addEventListener('change', e => { for (const f of e.target.files) form.files.push({ name: f.name, size: f.size }); e.target.value = ''; paintFiles(); });
  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    if (live) {
      const nik = $('#f-pat').value, btn = $('#form button[type=submit]');
      if (!nik) { MyFx.toast('Pick a registered patient first'); return; }
      // the body POST /api/orders takes (as the old bedah.html sends it) plus this unit. No ICD-10 code: this form has none.
      const body = { patient: { nik }, exam: { modality: form.mod, description: $('#f-exam').value.replace('\n', ' ') },
        indication: { text: $('#f-hist').value.trim() }, priority: form.pri, note: '', unit: inst.local };
      btn.disabled = true;
      try {
        const o = await MyApi.post('orders', body);
        $('#f-hist').value = ''; view = 'open'; paintFilter(); await render(o.id); MyFx.toast('Request ' + o.id + ' sent to Radiology');
      } catch (err) {
        MyFx.toast(err.status === 403 ? 'Your account (' + (me ? me.role : '?') + ') cannot send requests. Sign in as a ward doctor.' : 'Not sent: ' + err.message);
      }
      btn.disabled = false; return;
    }
    const p = MockStore.patients().find(x => x.mrn === $('#f-pat').value);
    const o = MockStore.addOrder({ dept: id, ...p, pri: form.pri, mod: form.mod, exam: $('#f-exam').value, referrer: $('#f-ref').value, history: $('#f-hist').value.trim(), files: form.files });
    $('#f-hist').value = ''; form.files = []; paintFiles(); view = 'open'; paintFilter(); render(o.id); MyFx.toast('Request ' + o.id + ' sent to Radiology');
  });

  // a backend request in the shape this page draws (statuses: requested -> imaged -> reported, or returned = sent back)
  const ST = { requested: 'Requested', imaged: 'Imaged', reported: 'Reported', returned: 'Rejected' };
  // the exam as shown: the modality code, unless the description already starts with it ("CT Head", "MRI Brain")
  const examText = ex => { const m = ex.modality || '', d = ex.description || ''; return (m && d.toUpperCase().startsWith(m) ? d : [m, d].filter(Boolean).join(' ')) || '-'; };
  const fromApi = o => { const d = o.data || {}, p = d.patient || {}, ex = d.exam || {}, s = o.study || {}, t = new Date(o.created);
    return { id: o.id, name: p.name || '-', mrn: p.nik || '-', pri: d.priority === 'CITO' ? 'CITO' : 'ROUTINE', priCls: d.priority === 'CITO' ? 'stat' : 'routine',
      exam: examText(ex), status: ST[o.status] || o.status, note: (d.returned && d.returned.reason) || '',
      clock: isNaN(t) ? '-' : String(t.getHours()).padStart(2, '0') + '.' + String(t.getMinutes()).padStart(2, '0') + ' WIB',
      impression: s.icd10 ? s.icd10 + ' ' + (s.diagnosis || '') + (s.finding ? ' · ' + s.finding : '') : '' }; };

  let view = 'open';
  const STEPS = live ? ['Requested', 'Imaged', 'Reported'] : ['Requested', 'Accepted', 'Imaged', 'Reported'], OPEN = ['Requested', 'Accepted', 'Imaged'];
  const paintFilter = () => document.querySelectorAll('#filter button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === view));
  $('#filter').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; paintFilter(); render(); });
  async function load() {
    if (!live) return MockStore.orders().filter(o => o.dept === id);
    try { return (await MyApi.get('orders')).filter(o => unitOf(o) === inst.local.toLowerCase()).map(fromApi); }
    catch (err) { const box = $('#list'); box.innerHTML = '<div class="empty"></div>'; box.firstChild.textContent = err.status === 403 ? 'Your account cannot see requests.' : 'Requests could not be loaded: ' + err.message; return null; }
  }
  async function render(fresh) {
    const rows = await load(); if (!rows) return;
    const box = $('#list'); box.textContent = '';
    const list = rows.filter(o => view === 'all' || (view === 'open') === OPEN.includes(o.status));
    if (!list.length) { box.innerHTML = '<div class="empty">' + (view === 'done' ? 'No results yet.' : 'Nothing here yet. Send a request on the left.') + '</div>'; return; }
    list.forEach((o, n) => {
      const d = document.createElement('div'); d.className = 'ord wrap' + (o.id === fresh ? ' on' : ''); d.style.setProperty('--n', n);
      d.innerHTML = '<span class="chip pri ' + (o.priCls || o.pri.toLowerCase()) + '"></span><span class="who"><b></b><small></small></span><span class="exam"></span><span class="chip st-' + o.status + '"></span><span class="when"></span>';
      d.querySelector('.pri').textContent = o.pri; d.querySelector('b').textContent = o.name; d.querySelector('small').textContent = o.id + '  ·  ' + o.mrn;
      d.querySelector('.exam').textContent = o.exam.replace('\n', ' '); d.querySelector('.st-' + o.status).textContent = o.status; d.querySelector('.when').textContent = o.clock;
      if (o.status === 'Rejected') { const r = document.createElement('div'); r.className = 'result bad'; r.textContent = 'Radiology sent it back: ' + (o.note || 'no reason given'); d.append(r); }
      else {
        const at = STEPS.indexOf(o.status), s = document.createElement('div'); s.className = 'steps';
        STEPS.forEach((t, i) => { if (i) { const l = document.createElement('i'); if (i <= at) l.className = 'done'; s.append(l); } const sp = document.createElement('span'); sp.textContent = t; if (i <= at) sp.className = 'done'; s.append(sp); });
        d.append(s);
        if (o.status === 'Reported') { const r = document.createElement('div'); r.className = 'result'; r.textContent = (live ? 'Reading: ' : 'Impression: ') + (o.impression || '(empty)'); d.append(r); }
      }
      box.append(d);
    });
  }
  render();
  if (!live) addEventListener('storage', () => render());       // another tab (Radiology) changed an order
})();
</script>
</body>
</html>
